<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22080d" />
      <stop offset="55%" stop-color="#140709" />
      <stop offset="100%" stop-color="#271206" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="16" y1="14" x2="48" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <radialGradient id="innerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Squircle Background -->
  <rect x="3.5" y="3.5" width="57" height="57" rx="15.5" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="3.2" />
  <rect x="6" y="6" width="52" height="52" rx="13" fill="url(#innerGlow)" />

  <!-- Clapperboard (hinged on left, opening up to right) -->
  <g stroke="url(#goldGrad)" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Lower Slate Box -->
    <rect x="17.5" y="30.5" width="29" height="18" rx="3" fill="#f59e0b" fill-opacity="0.06" />
    <!-- Hinged Top Clapper Bar (tilted -14 deg around center) -->
    <g transform="translate(31.2 22) rotate(-13.8)">
      <rect x="-14.5" y="-4" width="29" height="8" rx="2.2" fill="#f59e0b" fill-opacity="0.10" />
      <line x1="-5.5" y1="3.8" x2="-2" y2="-3.8" />
      <line x1="3.5" y1="3.8" x2="7" y2="-3.8" />
    </g>
  </g>
</svg>
